{% extends "allauth/layouts/entrance.html" %}

{% block content %}
    <!-- Authentication page section with responsive padding -->
    <section class="auth-page py-4 py-md-5">
        <!-- Centered container with Bootstrap responsive grid -->
        <div class="row justify-content-center mx-0">
            <!-- Responsive column: full width on mobile, narrowing on larger screens for better UX -->
            <!-- col-12: 100% on mobile, col-sm-11: 91.67% on small screens, col-md-9: 75% on medium screens -->
            <!-- col-lg-6: 50% on large screens, col-xl-5: 41.67% on extra large screens -->
            <div class="col-10 col-sm-10 col-md-9 col-lg-6 col-xl-5">
                <!-- Card container with shadow and custom authentication styling -->
                <div class="card shadow-sm border-0 auth-panel">
                    <!-- Card body with responsive padding (larger on medium+ screens) -->
                    <div class="card-body p-4 p-md-5">
                        <!-- Block for child templates to override with specific form content -->
                        {% block content_inner %}{% endblock content_inner %}
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock content %}
