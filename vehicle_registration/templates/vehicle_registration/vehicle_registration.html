<!-- Vehicle registration page (Nerijus Kmitas x24170232) -->

{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div id="vehicle_div">
        <h2 class="mb-4">Register Vehicle</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="hidden"
                name="event_id"
                value="{{ event_id }}">

            <div class="mb-3">
                <label class="form-label">
                    Registration Plate
                </label>
                {{ form.registration_plate }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Vehicle Make
                </label>
                {{ form.make }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Vehicle Model
                </label>
                {{ form.model }}
            </div>

            <button type="submit" id="reg_veh_btn">
                Register Vehicle
            </button>
        </form>

    </div>
</div>

{% endblock %}
